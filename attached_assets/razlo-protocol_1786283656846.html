<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razlo · The Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --surface:#F5F3EF; --ink:#0E0E0E;
    --ink-soft:rgba(14,14,14,.6); --ink-faint:rgba(14,14,14,.42);
    --copper:#B15D2E; --copper-light:#FFB692;
    --rule:rgba(14,14,14,.12);
    --glass-border:rgba(255,255,255,.65);
    --glass-bg:rgba(255,255,255,.55);
  }
  body.dark {
    --surface:#131313; --ink:#FFF;
    --ink-soft:rgba(255,255,255,.6); --ink-faint:rgba(255,255,255,.45);
    --copper:#FFB692; --copper-light:#FFB692;
    --rule:rgba(255,255,255,.12);
    --glass-border:rgba(255,255,255,.18);
    --glass-bg:rgba(255,255,255,.05);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Space Grotesk",system-ui,sans-serif;
    background:var(--surface); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    transition:background .5s,color .5s;
  }

  .razlo-kicker { font-size:10px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; color:var(--copper); }

  /* ============ SCROLL FUEL + STICKY 100svh STAGE ============ */
  .roadmap-wrap { height:360vh; }               /* ← the scroll distance */
  @media (max-width:820px){ .roadmap-wrap { height:300vh; } }

  .roadmap {
    position:sticky; top:0;
    height:100svh;                              /* ← always one screen */
    display:flex; flex-direction:column;
    padding:clamp(1.2rem,4vh,2.6rem) clamp(1.25rem,4vw,3rem) 0;
    max-width:1500px; margin:0 auto;
    overflow:hidden;
  }

  /* ---------- header row: title left · toggle right ---------- */
  .hero { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; }
  .hero h1 {
    margin-top:.9rem;
    font-family:"Noto Serif",serif; font-weight:400;
    font-size:clamp(1.9rem,5vw,4.4rem); line-height:.9; letter-spacing:-.04em;
  }
  .hero h1 em { font-style:italic; color:var(--copper); }
  .hero-mask { display:block; overflow:hidden; }
  .hero-mask > span { display:block; transform:translateY(112%); animation:maskUp 1s cubic-bezier(.16,1,.3,1) forwards; }
  .hero-mask:nth-child(2) > span { animation-delay:.1s; }
  @keyframes maskUp { to { transform:none; } }

  .theme-toggle {
    flex-shrink:0; margin-top:2px;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--rule); background:var(--glass-bg);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    cursor:pointer; font-size:13px;
    display:grid; place-items:center;
    transition:transform .3s;
  }
  .theme-toggle:hover { transform:scale(1.1); }

  /* ---------- map area ---------- */
  .map-area { position:relative; flex:1; min-height:0; }

  .ambient { position:absolute; inset:0; pointer-events:none; }
  .ambient::before, .ambient::after { content:""; position:absolute; border-radius:50%; filter:blur(70px); }
  .ambient::before { top:8%; left:6%; width:340px; height:340px; background:radial-gradient(circle, rgba(177,93,46,.09), transparent 70%); }
  .ambient::after { bottom:4%; right:4%; width:380px; height:380px; background:radial-gradient(circle, rgba(255,182,146,.07), transparent 70%); }

  .glass-bubble {
    position:absolute; border-radius:50%;
    border:1px solid var(--glass-border);
    background:linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,.08));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    pointer-events:none; opacity:.8;
  }
  body.dark .glass-bubble { background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); }
  .glass-bubble::after { content:""; position:absolute; top:20%; left:22%; width:30%; height:22%; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(2px); }
  body.dark .glass-bubble::after { background:rgba(255,255,255,.15); }
  .gb-1 { top:10%; right:5%;  width:56px; height:56px; animation:drift 9s  ease-in-out infinite alternate; }
  .gb-2 { top:42%; left:3%;   width:34px; height:34px; animation:drift 11s ease-in-out infinite alternate-reverse; }
  .gb-3 { bottom:16%; right:12%; width:42px; height:42px; border-color:rgba(255,182,146,.4); background:linear-gradient(135deg, rgba(255,182,146,.28), rgba(255,255,255,.08)); animation:drift 8s ease-in-out infinite alternate; }
  .gb-4 { bottom:30%; left:11%; width:24px; height:24px; animation:drift 10s ease-in-out infinite alternate-reverse; }
  .gb-5 { top:60%; left:46%;  width:20px; height:20px; border-color:rgba(255,182,146,.3); background:rgba(255,182,146,.18); animation:drift 12s ease-in-out infinite alternate; }
  @keyframes drift { from { transform:translateY(0) rotate(-2deg); } to { transform:translateY(-18px) rotate(3deg); } }

  .map { position:absolute; inset:0; pointer-events:none; }
  .map svg { position:absolute; inset:0; width:100%; height:100%; }
  .track { fill:none; stroke:var(--rule); stroke-width:1.5; stroke-dasharray:3 9; }
  .route { fill:none; stroke:var(--copper); stroke-width:2.5; stroke-linecap:round; filter:drop-shadow(0 0 6px rgba(177,93,46,.35)); }
  .map-m { display:none; }
  @media (max-width:820px){ .map-d { display:none; } .map-m { display:block; } .track,.route { vector-effect:non-scaling-stroke; } }

  .ink-drop {
    position:absolute; z-index:3; width:11px; height:11px; border-radius:50%;
    background:var(--copper); transform:translate(-50%,-50%);
    box-shadow:0 0 0 5px rgba(177,93,46,.16), 0 0 18px rgba(177,93,46,.55);
    pointer-events:none;
  }

  /* ---------- waypoints ---------- */
  .waypoint {
    position:absolute; z-index:4; transform:translate(-50%,-50%);
    opacity:0; scale:.4;
    transition:opacity .6s cubic-bezier(.16,1,.3,1), scale .7s cubic-bezier(.16,1,.3,1);
  }
  .waypoint.lit { opacity:1; scale:1; }
  .wp-bubble {
    position:relative; width:clamp(68px,7.5vw,112px); aspect-ratio:1; border-radius:50%;
    border:1px solid var(--glass-border);
    background:radial-gradient(72% 60% at 30% 24%, rgba(255,255,255,.7), var(--glass-bg) 62%);
    backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 16px 40px rgba(177,93,46,.16), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -8px 18px rgba(255,255,255,.3);
    display:grid; place-items:center;
    animation:wobble 6s ease-in-out infinite;
    transition:border-color .5s;
  }
  body.dark .wp-bubble {
    background:radial-gradient(72% 60% at 30% 24%, rgba(255,255,255,.14), var(--glass-bg) 62%);
    box-shadow:0 16px 40px rgba(255,182,146,.14), inset 0 1px 0 rgba(255,255,255,.2), inset 0 -8px 18px rgba(255,255,255,.06);
  }
  .wp-bubble::after { content:""; position:absolute; top:16%; left:20%; width:30%; height:24%; border-radius:50%; background:rgba(255,255,255,.6); filter:blur(3px); }
  body.dark .wp-bubble::after { background:rgba(255,255,255,.16); }
  .waypoint.lit .wp-bubble { border-color:rgba(177,93,46,.45); }
  .wp-num { font-family:"Noto Serif",serif; font-style:italic; font-weight:500; font-size:clamp(1.5rem,3.2vw,2.6rem); color:var(--copper); }
  @keyframes wobble { 0%,100% { transform:translateY(0) rotate(-1.5deg); } 50% { transform:translateY(-7px) rotate(1.5deg); } }
  @media (max-width:820px){ .wp-bubble { width:58px; } .wp-num { font-size:1.25rem; } }

  /* ---------- phase cards ---------- */
  .phase {
    position:absolute; z-index:3; max-width:300px;
    opacity:0; transform:translateY(18px);
    transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1);
  }
  .phase.lit { opacity:1; transform:none; }
  .phase-kicker { font-size:9px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; color:var(--copper); margin-bottom:.45rem; }
  .phase-title { font-family:"Noto Serif",serif; font-weight:400; font-size:clamp(1.4rem,2.4vw,2.1rem); line-height:1.05; letter-spacing:-.02em; margin-bottom:.6rem; }
  .phase-title em { font-style:italic; color:var(--copper); }
  .pill-bubble {
    position:relative; display:inline-block;
    font-family:"Noto Serif",serif; font-style:italic; font-weight:500; font-size:.82rem;
    color:var(--copper); padding:.14em .6em .2em; border-radius:999px;
    border:1px solid rgba(255,182,146,.45); background:var(--glass-bg);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 6px 16px rgba(177,93,46,.14), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .pill-bubble::after { content:""; position:absolute; top:22%; left:16%; width:24%; height:32%; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(1.5px); }
  body.dark .pill-bubble::after { background:rgba(255,255,255,.16); }
  @media (max-width:820px){ .phase { max-width:56%; } .phase-title { font-size:clamp(1.05rem,5vw,1.4rem); } }

  /* ---------- desktop zig-zag (top → bottom) ---------- */
  .w-1 { left:12%; top:10%; }  .p-1 { left:21%; top:6%;  }
  .w-2 { left:82%; top:34%; }  .p-2 { right:21%; top:29%; text-align:right; }
  .w-3 { left:18%; top:62%; }  .p-3 { left:27%; top:58%; }
  .w-4 { left:84%; top:84%; }  .p-4 { right:20%; top:76%; text-align:right; }

  /* ---------- mobile vertical wave ---------- */
  @media (max-width:820px){
    .w-1 { left:22%; top:8%;  } .p-1 { left:40%; top:4%;  text-align:left; }
    .w-2 { left:80%; top:32%; } .p-2 { left:6%;  top:27%; text-align:left; }
    .w-3 { left:22%; top:58%; } .p-3 { left:40%; top:54%; text-align:left; }
    .w-4 { left:80%; top:82%; } .p-4 { left:6%;  top:74%; text-align:left; }
  }
</style>
</head>
<body>

<div class="roadmap-wrap">
  <section class="roadmap">

    <div class="hero">
      <div>
        <span class="razlo-kicker">Razlo.digital / The protocol</span>
        <h1>
          <span class="hero-mask"><span>How the work</span></span>
          <span class="hero-mask"><span><em>moves.</em></span></span>
        </h1>
      </div>
      <button class="theme-toggle" onclick="document.body.classList.toggle('dark');this.textContent=document.body.classList.contains('dark')?'☀️':'🌙'" aria-label="Toggle theme">🌙</button>
    </div>

    <div class="map-area">
      <div class="ambient"></div>
      <div class="glass-bubble gb-1"></div><div class="glass-bubble gb-2"></div>
      <div class="glass-bubble gb-3"></div><div class="glass-bubble gb-4"></div>
      <div class="glass-bubble gb-5"></div>

      <div class="map map-d">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="none">
          <path class="track" d="M 168 90 C 520 120 860 210 1148 306 C 900 410 560 460 252 558 C 560 650 900 690 1176 756"/>
          <path class="route" id="routeD" d="M 168 90 C 520 120 860 210 1148 306 C 900 410 560 460 252 558 C 560 650 900 690 1176 756"/>
        </svg>
      </div>
      <div class="map map-m">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <path class="track" d="M 22 8 C 55 14 80 20 80 32 C 80 44 22 46 22 58 C 22 70 55 74 80 82"/>
          <path class="route" id="routeM" d="M 22 8 C 55 14 80 20 80 32 C 80 44 22 46 22 58 C 22 70 55 74 80 82"/>
        </svg>
      </div>

      <div class="ink-drop" id="inkDrop"></div>

      <div class="waypoint w-1"><div class="wp-bubble"><span class="wp-num">01</span></div></div>
      <article class="phase p-1">
        <p class="phase-kicker">01 · Discovery</p>
        <h3 class="phase-title">We start by <em>listening.</em></h3>
        <span class="pill-bubble">2–3 wks</span>
      </article>

      <div class="waypoint w-2"><div class="wp-bubble"><span class="wp-num">02</span></div></div>
      <article class="phase p-2">
        <p class="phase-kicker">02 · Strategy</p>
        <h3 class="phase-title">Then we draw <em>the map.</em></h3>
        <span class="pill-bubble">1–2 wks</span>
      </article>

      <div class="waypoint w-3"><div class="wp-bubble"><span class="wp-num">03</span></div></div>
      <article class="phase p-3">
        <p class="phase-kicker">03 · Execution</p>
        <h3 class="phase-title">We build <em>with care.</em></h3>
        <span class="pill-bubble">8–12 wks</span>
      </article>

      <div class="waypoint w-4"><div class="wp-bubble"><span class="wp-num">04</span></div></div>
      <article class="phase p-4">
        <p class="phase-kicker">04 · Launch &amp; Growth</p>
        <h3 class="phase-title">And we <em>stay.</em></h3>
        <span class="pill-bubble">ongoing</span>
      </article>
    </div>

  </section>
</div>

<script>
const routeD = document.getElementById('routeD');
const routeM = document.getElementById('routeM');
const ink = document.getElementById('inkDrop');
const wrap = document.querySelector('.roadmap-wrap');
const wps = [...document.querySelectorAll('.waypoint')];
const phs = [...document.querySelectorAll('.phase')];
const AT = [0.02, 0.34, 0.66, 0.93];

const mq = matchMedia('(max-width:820px)');
let route, len;

function measure(){
  route = mq.matches ? routeM : routeD;
  [routeD, routeM].forEach(r => {
    const L = r.getTotalLength();
    r.style.strokeDasharray = L;
    r.style.strokeDashoffset = L;
  });
  len = route.getTotalLength();
}
measure();
addEventListener('resize', measure);
mq.addEventListener?.('change', measure);

let ticking = false;
function render(){
  const total = wrap.offsetHeight - innerHeight;
  const p = Math.max(0, Math.min(1, -wrap.getBoundingClientRect().top / total));

  route.style.strokeDashoffset = len * (1 - p);

  const svg = route.ownerSVGElement;
  const vb = svg.viewBox.baseVal;
  const sr = svg.getBoundingClientRect();
  const pt = route.getPointAtLength(p * len);
  ink.style.left = ((pt.x - vb.x) / vb.width)  * sr.width  + 'px';
  ink.style.top  = ((pt.y - vb.y) / vb.height) * sr.height + 'px';

  wps.forEach((w,i)=> w.classList.toggle('lit', p >= AT[i]));
  phs.forEach((c,i)=> c.classList.toggle('lit', p >= AT[i]));
  ticking = false;
}
addEventListener('scroll', ()=>{ if(!ticking){ requestAnimationFrame(render); ticking = true; } }, { passive:true });
render();
</script>
</body>
</html>
