kind = "web"
previewPath = "/"
title = "Razlo Site"
description = "The imported Razlo v2 portfolio and studio website from Rafael-bulezi's public GitHub repository, ready to preview and continue editing."
version = "1.0.0"
id = "artifacts/razlo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21277

[services.development]
run = "pnpm --filter @workspace/razlo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/razlo", "run", "build" ]
serve = "static"
publicDir = "artifacts/razlo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21277"
BASE_PATH = "/"
